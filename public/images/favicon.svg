<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background solid green -->
  <rect width="100" height="100" rx="24" fill="#16A34A" />
  
  <!-- Huruf F putih bold -->
  <text x="50" y="70" font-family="'Inter', Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">F</text>
  
  <!-- Garis lapangan tipis di bawah F (opsional) -->
  <line x1="25" y1="85" x2="75" y2="85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
</svg>